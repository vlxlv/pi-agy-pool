name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "::error::Tag '$TAG' does not match format 'vX.Y.Z'"
            exit 1
          fi
          EXPECTED_VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$EXPECTED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version '$EXPECTED_VERSION' does not match package.json version '$PACKAGE_VERSION'"
            exit 1
          fi
          echo "Verified: Tag '$TAG' matches package.json version '$PACKAGE_VERSION'"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run offline test suite
        run: npm test

      - name: Pack distribution tarball
        run: |
          TARBALL=$(npm pack)
          echo "TARBALL_FILE=$TARBALL" >> "$GITHUB_ENV"
          echo "Generated tarball: $TARBALL"

      - name: Verify tarball contents
        run: |
          node scripts/verify-package.mjs "$TARBALL_FILE"

      - name: Create GitHub Release and attach tarball
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat << 'EOF' > /tmp/release_notes.md
          # pi-agy-pool ${TAG}

          Pi model-provider extension for `agy-pool-go`.

          ## Installation

          Recommended Git installation (tracks the repository default branch):

          ```bash
          pi install git:github.com/vlxlv/pi-agy-pool
          pi update git:github.com/vlxlv/pi-agy-pool
          # Remove using the same source:
          pi remove git:github.com/vlxlv/pi-agy-pool
          ```

          The attached `.tgz` is an npm-compatible release archive. Pi 0.87.1
          requires extraction before local-directory installation; it cannot load
          the archive directly. Keep the extracted directory after installation.

          ```bash
          mkdir -p "$HOME/.local/share/pi-agy-pool/${VERSION}"
          tar -xzf ./pi-agy-pool-${VERSION}.tgz -C "$HOME/.local/share/pi-agy-pool/${VERSION}"
          pi install "$HOME/.local/share/pi-agy-pool/${VERSION}/package"
          # Remove using the same directory source:
          pi remove "$HOME/.local/share/pi-agy-pool/${VERSION}/package"
          ```

          ## Architecture

          ```text
          Pi
           ↓
          pi-agy-pool (installed extension package)
           ↓ subprocess spawn (argument array)
          agy-pool run -- <native AGY stream-json args>
           ↓
          official agy-native
           ↓ CLOUD_CODE_URL configured by agy-pool-go
          agy-pool-go local gateway (:8899)
           ↓
          existing multi-account scheduler / OAuth / quota / failover
           ↓
          Google
          ```

          ## External Prerequisites

          - **Pi CLI** (`pi`) `>=0.87.1`
          - **`agy-pool`** binary installed and available in `PATH` (or configured via `AGY_POOL_BIN`)
          - Running **`agy-pool-go`** daemon
          - Official **Antigravity** installed and managed by `agy-pool`

          ## Autonomous Permission Notice

          `pi-agy-pool` launches official Antigravity headless with `--dangerously-skip-permissions` and `--disable-slash-commands`. Antigravity operates autonomously without interactive stdin tool approval prompts. Do not execute untrusted prompts in sensitive environments.
          EOF
          VERSION="${TAG#v}"
          sed -i "s/\${TAG}/$TAG/g" /tmp/release_notes.md
          sed -i "s/\${VERSION}/$VERSION/g" /tmp/release_notes.md
          gh release create "$TAG" "$TARBALL_FILE" \
            --title "pi-agy-pool $TAG" \
            --notes-file /tmp/release_notes.md
