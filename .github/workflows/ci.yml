name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run offline test suite
        run: npm test

      - name: Inspect and verify package contents
        run: |
          PACK_JSON=$(npm pack --dry-run --json)
          node -e '
            const pack = JSON.parse(process.argv[1])[0];
            const files = pack.files.map(f => f.path).sort();
            const expected = [
              "LICENSE",
              "README.md",
              "package.json",
              "src/agy-events.ts",
              "src/agy-process.ts",
              "src/index.ts",
              "src/models.ts",
              "src/provider.ts",
              "src/stream.ts"
            ].sort();
            console.log("Package files count:", files.length);
            console.log("Package files:", files);
            if (files.length !== expected.length || !files.every((f, i) => f === expected[i])) {
              console.error("Package verification failed: unexpected files list", { files, expected });
              process.exit(1);
            }
            for (const forbidden of ["test", "AGENTS.md", "tsconfig.json", ".github", ".git"]) {
              if (files.some(f => f.includes(forbidden))) {
                console.error("Package verification failed: forbidden pattern found:", forbidden);
                process.exit(1);
              }
            }
            console.log("Package verification PASSED.");
          ' "$PACK_JSON"
